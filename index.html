<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout – Gaming Subscription</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    label { display: block; margin-bottom: 12px; }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 4px;
    }
    .card-field {
      height: 3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    #pay-button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Checkout – Gaming Subscription</h2>

  <label>
    Subscription Length
    <select id="sub-length">
      <option value="10">1 Month – $10</option>
      <option value="25">3 Months – $25</option>
      <option value="45">6 Months – $45</option>
      <option value="80">12 Months – $80</option>
      <option value="custom">Custom Amount</option>
    </select>
  </label>

  <label id="custom-amount-label" style="display:none;">
    Enter Custom Amount ($)
    <input id="custom-amount" type="number" min="1" placeholder="Enter amount">
  </label>

  <p>Total: <strong id="total-display">$10.00</strong></p>

  <h3>Card Details</h3>

  <div class="card-field" id="card-number"></div>
  <div class="card-field" id="card-expiry"></div>
  <div class="card-field" id="card-cvv"></div>

  <button id="pay-button">Pay Now</button>

  <!-- PayPal Checkout SDK + Card Fields -->
  <script src="https://www.paypal.com/sdk/js?client-id=BAAtcs22ZtjAU8gu6J3LfBuNHhGqIvBsUeR6_RFYOpkozzFXXfTcK9POjAmm8ijuCw20vfwAHXcdEpuH7w&components=card-fields&intent=capture&currency=USD"></script>

  <script>
    const BACKEND_URL = "https://paypal-backend-ni4v.onrender.com";
    let currentTotal = 10.00;

    const subSelect = document.getElementById("sub-length");
    const customLabel = document.getElementById("custom-amount-label");
    const customInput = document.getElementById("custom-amount");
    const totalDisplay = document.getElementById("total-display");

    subSelect.addEventListener("change", () => {
      const val = subSelect.value;
      if (val === "custom") {
        customLabel.style.display = "block";
        currentTotal = 0;
        totalDisplay.textContent = "$0.00";
      } else {
        customLabel.style.display = "none";
        currentTotal = parseFloat(val);
        totalDisplay.textContent = "$" + currentTotal.toFixed(2);
      }
    });

    customInput.addEventListener("input", () => {
      currentTotal = parseFloat(customInput.value || 0);
      totalDisplay.textContent = "$" + currentTotal.toFixed(2);
    });

    async function createOrder() {
      const res = await fetch(`${BACKEND_URL}/create-order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: currentTotal.toFixed(2) })
      });

      const data = await res.json();
      console.log("Order:", data);

      if (!data.id) throw new Error("Order creation failed");
      return data.id;
    }

    async function captureOrder(orderID) {
      const res = await fetch(`${BACKEND_URL}/capture-order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderID })
      });
      return res.json();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const cardFields = paypal.CardFields({
        style: {
          input: { "font-size": "16px", "font-family": "system-ui" }
        }
      });

      cardFields.render({
        number: "#card-number",
        expirationDate: "#card-expiry",
        securityCode: "#card-cvv"
      });

      document.getElementById("pay-button").addEventListener("click", async () => {
        try {
          const orderId = await createOrder();

          const result = await cardFields.submit({
            orderId,
            contingencies: ["SCA_WHEN_REQUIRED"]
          });

          console.log("Submit result:", result);

          const capture = await captureOrder(orderId);
          console.log("Capture:", capture);

          alert("Payment successful!");
        } catch (err) {
          console.error("Checkout error:", err);
          alert("Payment failed.");
        }
      });
    });
  </script>

</body>
</html>
