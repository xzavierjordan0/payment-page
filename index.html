<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ACDC Checkout</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    label { display: block; margin-bottom: 12px; }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 4px;
    }
    #billing-error {
      color: red;
      margin-bottom: 10px;
      display: none;
    }
    .card-field {
      height: 3rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <h2>Checkout – Gaming Subscription</h2>

  <label>
    Subscription Length
    <select id="sub-length">
      <option value="10">1 Month – $10</option>
      <option value="25">3 Months – $25</option>
      <option value="45">6 Months – $45</option>
      <option value="80">12 Months – $80</option>
      <option value="custom">Custom Amount</option>
    </select>
  </label>

  <label id="custom-amount-label" style="display:none;">
    Enter Custom Amount ($)
    <input id="custom-amount" type="number" min="1" placeholder="Enter amount">
  </label>

  <p>Total: <strong id="total-display">$10.00</strong></p>

  <div id="billing-section">
    <h3>Billing Info</h3>

    <label>
      Name on card
      <input id="bill-name" type="text" placeholder="John Doe">
    </label>

    <label>
      Country
      <select id="bill-country">
        <option value="US" selected>United States</option>
        <option value="CA">Canada</option>
        <option value="GB">United Kingdom</option>
        <option value="AU">Australia</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="BR">Brazil</option>
        <option value="MX">Mexico</option>
      </select>
    </label>

    <div id="billing-error">Please enter your name.</div>
  </div>

  <h3>Card Details</h3>

  <div class="card-field" id="paypal-card-fields-number"></div>
  <div class="card-field" id="paypal-card-fields-expiry"></div>
  <div class="card-field" id="paypal-card-fields-cvv"></div>

  <button id="pay-button" style="width:100%;padding:14px;font-size:16px;margin-top:8px;cursor:pointer;">
    Pay Now
  </button>

  <!-- PayPal JS SDK v6 — LIVE -->
  <script
    async
    src="https://www.paypal.com/web-sdk/v6/core"
    onload="onPayPalWebSdkLoaded()">
  </script>

  <script>
    const BACKEND_URL = "https://paypal-backend-ni4v.onrender.com";

    let currentTotal = 10.00;

    document.getElementById("sub-length").addEventListener("change", function () {
      const val = this.value;
      if (val === "custom") {
        document.getElementById("custom-amount-label").style.display = "block";
        currentTotal = 0;
        document.getElementById("total-display").textContent = "$0.00";
      } else {
        document.getElementById("custom-amount-label").style.display = "none";
        currentTotal = parseFloat(val);
        document.getElementById("total-display").textContent = "$" + currentTotal.toFixed(2);
      }
    });

    document.getElementById("custom-amount").addEventListener("input", function () {
      currentTotal = parseFloat(this.value || 0);
      document.getElementById("total-display").textContent = "$" + currentTotal.toFixed(2);
    });

    function getBillingData() {
      const name = document.getElementById("bill-name").value.trim();
      const country = document.getElementById("bill-country").value;

      if (!name) {
        document.getElementById("billing-error").style.display = "block";
        return null;
      }
      document.getElementById("billing-error").style.display = "none";
      return { name, country_code: country };
    }

    async function createOrder() {
      const billing = getBillingData();
      if (!billing) throw new Error("Billing data missing");

      const res = await fetch(`${BACKEND_URL}/create-order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          amount: currentTotal.toFixed(2),
          billing_address: billing
        })
      });
      const data = await res.json();
      return data.id;
    }

    async function captureOrder(orderID) {
      const res = await fetch(`${BACKEND_URL}/capture-order`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderID })
      });
      return res.json();
    }

    async function onPayPalWebSdkLoaded() {
      try {
        const sdk = await window.paypal.createInstance({
          clientId: "YOUR_LIVE_CLIENT_ID_HERE",
          components: ["card-fields"],
          pageType: "checkout",
          locale: "en-US",
        });

        const paymentMethods = await sdk.findEligibleMethods();

        if (!paymentMethods.isEligible("advanced_cards")) {
          document.getElementById("pay-button").textContent = "Card payments unavailable";
          document.getElementById("pay-button").disabled = true;
          return;
        }

        const cardSession = sdk.createCardFieldsOneTimePaymentSession();

        const numberField = cardSession.createCardFieldsComponent({
          type: "number",
          placeholder: "Card number",
          style: { fontSize: "16px", fontFamily: "system-ui" }
        });

        const expiryField = cardSession.createCardFieldsComponent({
          type: "expiry",
          placeholder: "MM/YY",
          style: { fontSize: "16px", fontFamily: "system-ui" }
        });

        const cvvField = cardSession.createCardFieldsComponent({
          type: "cvv",
          placeholder: "CVV",
          style: { fontSize: "16px", fontFamily: "system-ui" }
        });

        document.querySelector("#paypal-card-fields-number").appendChild(numberField);
        document.querySelector("#paypal-card-fields-expiry").appendChild(expiryField);
        document.querySelector("#paypal-card-fields-cvv").appendChild(cvvField);

        document.getElementById("pay-button").addEventListener("click", async () => {
          try {
            const orderId = await createOrder();

            const { data, state } = await cardSession.submit(orderId, {
              billingAddress: {
                countryCode: document.getElementById("bill-country").value
              }
            });

            switch (state) {
              case "succeeded": {
                const capture = await captureOrder(data.orderId);
                console.log("Captured:", capture);
                alert("Payment successful!");
                break;
              }
              case "canceled": {
                alert("Payment cancelled. You can try again.");
                break;
              }
              case "failed": {
                console.error("Card submission failed:", data);
                alert("Payment failed. Please check your card details.");
                break;
              }
              default:
                console.warn("Unhandled state:", state, data);
            }

          } catch (err) {
            console.error("Payment flow error:", err);
            alert("Checkout error. Please try again.");
          }
        });

      } catch (err) {
        console.error("SDK init failed:", err);
      }
    }
  </script>

</body>
</html>
